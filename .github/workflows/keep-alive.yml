name: MongoDB Keep-Alive

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: node scripts/keep-alive.js
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
